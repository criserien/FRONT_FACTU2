<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calendario con Flexbox</title>
</head>
<body>

    <div class="calendar-container">
        <h2>Enero 2026</h2>

        <!-- Nombres de los días -->
        <div class="nom-dias">
            <div class="day-name">Lu</div>
            <div class="day-name">Ma</div>
            <div class="day-name">Mi</div>
            <div class="day-name">Ju</div>
            <div class="day-name">Vi</div>
            <div class="day-name">Sá</div>
            <div class="day-name">Do</div>
        </div>

        <div class="nom-dias">
            <!-- Espacios vacíos para ajustar el inicio (Enero 2026 empieza jueves) -->
            <div class="empty"></div>
            <div class="empty"></div>
            <div class="empty"></div>

            <!-- Días del mes (del 1 al 31) -->
            <div class="day" (click)="navegarADetalle($event)">1</div>
            <div class="day" (click)="navegarADetalle($event)">2</div>
            <div class="day" (click)="navegarADetalle($event)">3</div>
            <div class="day" (click)="navegarADetalle($event)">4</div>
        </div>

        <div class="nom-dias">
            <div class="day">5</div>
            <div class="day">6</div>
            <div class="day">7</div>
            <div class="day">8</div>
            <div class="day">9</div>
            <div class="day" (click)="navegarADetalle($event)">10</div>
            <div class="day" (click)="navegarADetalle($event)">11</div>
        </div>

        <div class="nom-dias">
            <div class="day">12</div>
            <div class="day">13</div>
            <div class="day">14</div>
            <div class="day">15</div>
            <div class="day">16</div>
            <div class="day">17</div>
            <div class="day">18</div>
        </div>

        <div class="nom-dias">
            <div class="day" (click)="navegarADetalle($event)">19</div>
            <div class="day" (click)="navegarADetalle($event)">20</div>
            <div class="day" (click)="navegarADetalle($event)">21</div>
            <div class="day" (click)="navegarADetalle($event)">22</div>
            <div class="day" (click)="navegarADetalle($event)">23</div>
            <div class="day" (click)="navegarADetalle($event)">24</div>
            <div class="day" (click)="navegarADetalle($event)">25</div>
        </div>

        <div class="nom-dias">
            <div class="day" (click)="navegarADetalle($event)">26</div>
            <div class="day" (click)="navegarADetalle($event)">27</div>
            <div class="day" (click)="navegarADetalle($event)">28</div>
            <div class="day" (click)="navegarADetalle($event)">29</div>
            <div class="day" (click)="navegarADetalle($event)">30</div>
            <div class="day" (click)="navegarADetalle($event)">31</div>
            <div class="empty"></div>
        </div>
    </div>

</body>
</html>
