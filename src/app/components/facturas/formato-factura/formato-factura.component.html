<div class="contenedor-principal">
  <div class="factura-card">
    
    <!-- Encabezado: Fecha y Número -->
    <div class="encabezado">
      <div class="numero-factura">
        <label>FACTURA N°</label>
        <input type="number" [(ngModel)]="numeroFactura" placeholder="001" />
      </div>

      <div class="fecha-box">
        <div class="fecha-titulos">
          <span>DÍA</span>
          <span>MES</span>
          <span>AÑO</span>
        </div>
        <div class="fecha-inputs">
          <input type="number" [(ngModel)]="diaRecibido" min="1" max="31" />
          <input type="number" [(ngModel)]="mesRecibido" min="1" max="12" />
          <input type="number" [(ngModel)]="anioRecibido" />
        </div>
      </div>
    </div>

    <!-- Datos del Cliente -->
    <div class="seccion-cliente">
      <div class="campo-cliente">
        <label>CLIENTE:</label>
        <input type="text" [(ngModel)]="cliente" placeholder="Nombre completo del cliente" />
      </div>
      <div class="campo-cliente">
        <label>DIR / TEL:</label>
        <input type="text" [(ngModel)]="direcTel" placeholder="Dirección o teléfono" />
      </div>
    </div>

    <!-- Tabla de Detalles (Filas editables) -->
    <div class="tabla-detalles">
      <div class="tabla-header">
        <div class="col-cant">CANT.</div>
        <div class="col-desc">DESCRIPCIÓN</div>
        <div class="col-unit">VALOR UNIT.</div>
        <div class="col-total">VALOR TOTAL</div>
      </div>

      <div class="tabla-body">
        <div class="tabla-fila" *ngFor="let item of filas; let i = index">
          <div class="col-cant">
            <input type="number" [(ngModel)]="item.cantidad" (ngModelChange)="actualizarFila(i)" min="0" />
          </div>
          <div class="col-desc">
            <input type="text" [(ngModel)]="item.producto" placeholder="Descripción del producto..." />
          </div>
          <div class="col-unit">
            <input type="number" [(ngModel)]="item.total" (ngModelChange)="actualizarFila(i)" min="0" />
          </div>
          <div class="col-total">
            <input type="number" [value]="item.total_mayor" readonly class="input-readonly" />
          </div>
        </div>
      </div>
    </div>

    <!-- Pie de Factura y Total -->
    <div class="pie-factura">
      <div class="recibi-box">
        <label>RECIBÍ CONFORME:</label>
        <input type="text" placeholder="Firma o aclaración" />
      </div>

      <div class="total-box">
        <span>TOTAL GENERAL:</span>
        <strong class="monto-total">$ {{ calcularTotalGeneral() | number }}</strong>
      </div>
    </div>

    <!-- Botón de Envío -->
    <div class="acciones">
      <button class="btn-guardar" (click)="guardarFactura()">
        💾 Guardar / Enviar a BD1 & BD2
      </button>
    </div>

  </div>
</div>
